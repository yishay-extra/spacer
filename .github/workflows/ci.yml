name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPACER_BUILD_APP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-app:
    name: App + tests (macOS)
    # macOS runners are expensive: run only on main, on manual dispatch,
    # or on a PR labelled "macos" (use it for macOS-only WPs before merging).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'macos'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Spacer-macOS
          path: build/Spacer_artefacts/Release/Spacer.app
          if-no-files-found: error
      - name: Upload engine check tool
        uses: actions/upload-artifact@v4
        with:
          name: spacer-engine-check-macOS
          path: build/spacer_engine_check_artefacts/
          if-no-files-found: error
